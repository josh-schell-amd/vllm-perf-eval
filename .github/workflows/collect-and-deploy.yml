name: Collect and Deploy

# Collects AMD nightly perf-eval results from Databricks, rebuilds the
# published payload, and deploys the static site.
#
# Where things live (docs/deploying.md). This repo is public and holds no data:
#   Databricks    vllm_perf_data_ingest, vllm_eval_data_ingest -- full history,
#                 queried fresh every run; there is no local event store
#   GitHub Pages  the site and the payload, sealed with the dashboard login
#   main          source only
on:
  schedule:
    # Hourly through the US Central working day, 9am-3pm in both CDT and CST
    # (cron is UTC and ignores daylight saving, so 14-21 UTC covers both),
    # to pick up a nightly as soon as its results land. A run with nothing
    # new costs one query per table and does not redeploy.
    - cron: '17 14-21 * * *'
  # A change to the page, or to how the payload is built, still re-collects:
  # there is no local store to rebuild from without querying Databricks again,
  # and a query is cheap compared to the old Buildkite artifact scan.
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/build_site.py'
      - 'scripts/perf_eval/__init__.py'
      - 'scripts/perf_eval/aggregate.py'
      - 'scripts/perf_eval/normalize.py'
      - 'scripts/perf_eval/events.py'
      - 'scripts/perf_eval/recipes.py'
      - 'scripts/perf_eval/databricks_collect.py'
      - '.github/workflows/collect-and-deploy.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish the site when done'
        required: false
        type: boolean
        default: true

# Serialize: two runs deploying would race.
concurrency:
  group: perf-eval-collect
  cancel-in-progress: false

# Each job asks for only what it uses.
permissions: {}

jobs:
  collect:
    name: Collect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      uploaded: ${{ steps.upload.outcome == 'success' }}
    steps:
      # Pinned to the same commit SHAs vllm-ci-dashboard uses.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: '0.12.19'

      # Runtime packages only (--no-dev), at the versions uv.lock pins. This
      # job holds the Databricks token, so nothing runs here that the
      # collector does not need; the test and lint tools run in CI.
      - name: Install dependencies
        run: |
          uv sync --locked --no-dev --python 3.12
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The deploy check compares against what is actually live, so a failed
      # or skipped deploy is not mistaken for a published one. If it cannot be
      # fetched or opened, the payload counts as changed and is deployed.
      - name: Fetch the published payload
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: |
          mkdir -p live
          curl -fsSL --retry 3 -o live/perf_eval.sealed.json "$SITE_URL/perf_eval.sealed.json?run=$GITHUB_RUN_ID" \
            || echo "No published payload at $SITE_URL; treating it as changed."
          python scripts/perf_eval/seal.py --open live/perf_eval.sealed.json --output live/perf_eval.json

      # The only step that receives the Databricks token. Databricks already
      # retains full history, so every run queries it fresh -- there is no
      # "just rebuild the payload from stored data" fast path to skip this on
      # a push, unlike the old Buildkite-artifact collector.
      - name: Collect from Databricks
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: reads gated models' config.json for their precision,
          # which labels both results and Coverage.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/perf_eval/databricks_collect.py --output data/events.jsonl

      # Refuses to write a payload that fails its sanity checks.
      - name: Aggregate the published payload
        run: python scripts/perf_eval/aggregate.py --store data/events.jsonl --output data/perf_eval.json

      # aggregate.py restamps generated_at every run, so the payload always
      # differs byte-wise. Publishing on that alone burns a Pages build to
      # republish identical numbers, and Pages allows only ~10 builds an hour.
      - name: Has anything actually changed?
        id: changed
        run: python scripts/perf_eval/payload_changed.py --current data/perf_eval.json --previous live/perf_eval.json

      # Seals the payload with the login; refuses to build without it.
      - name: Build the site
        env:
          DASHBOARD_USERNAME: ${{ secrets.DASHBOARD_USERNAME }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python scripts/build_site.py

      # Scheduled runs deploy only when the data changed. A push or manual run
      # always deploys, since the page itself may have changed. Only main
      # deploys: a manual run from another branch is a preview.
      - name: Upload the site
        id: upload
        if: >-
          github.ref == 'refs/heads/main' &&
          (steps.changed.outputs.changed == 'true' || github.event_name != 'schedule') &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy)
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./_site

      - name: Summary
        if: always()
        env:
          DEPLOY_SKIPPED: ${{ steps.changed.outputs.changed == 'false' && github.event_name == 'schedule' && '1' || '' }}
        run: >-
          python scripts/perf_eval/aggregate.py --summarize data/perf_eval.json
          ${DEPLOY_SKIPPED:+--deploy-skipped} >> "$GITHUB_STEP_SUMMARY"

      - name: Note a preview run
        if: always() && github.ref != 'refs/heads/main'
        run: |
          echo "- Preview of \`${GITHUB_REF_NAME}\`: nothing was published; only main does that." >> "$GITHUB_STEP_SUMMARY"

  # A separate job so only it holds the Pages and OIDC permissions, and so the
  # github-pages environment (main only) is not entered by a preview run.
  deploy:
    name: Deploy to GitHub Pages
    needs: collect
    if: github.ref == 'refs/heads/main' && needs.collect.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
